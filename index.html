<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جیهانا دەمژمێران | Watch Store</title>
    <!-- FontAwesome بۆ ئایکۆنان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #333333;
            --dark-color: #121212;
            --light-color: #FFFFFF;
            --gray-color: #555555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; }
        body { background-color: var(--light-color); color: var(--primary-color); line-height: 1.6; margin: 0; padding: 0; }

        /* Hero Section */
        .hero-section {
            background-color: #FFFFFF;
            padding: 0;
            width: 100%;
            margin: 0;
            border: none;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 380px;
            background: url('https://i.ibb.co/G4Nv2cYy/photo-2026-10-23-23-06-04.jpg') no-repeat center center/cover;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            border: none;
            margin: 0;
        }

        /* ئایکۆنا سەلکێ ل ڕەخێ چەپی ل سەر وێنەیێ سەرەکی */
        .hero-cart-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            font-size: 20px;
            border: 2px solid var(--dark-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .hero-cart-icon:hover {
            background: var(--dark-color);
            color: #fff;
        }
        .hero-cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
        }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #f4f4f4;
            border: 2px solid var(--dark-color);
            color: var(--dark-color);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--dark-color);
            color: #fff;
        }

        /* بەرهەم بێ هیچ ئیتار و سێبەر */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }
        .product-card {
            background: #FFFFFF; 
            border-radius: 0; 
            overflow: hidden;
            box-shadow: none; 
            transition: 0.3s;
            color: var(--primary-color);
            width: 100%;
            border: none;
        }
        
        .image-slider-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #FFFFFF;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            touch-action: pan-y; /* بۆ ڕێگری کرن لە scroll شاشەیی نەخوازراو دەمێ کشاندنێ */
        }
        
        /* Fake Zoom Effect ل سەر وێنەی دەمێ مەوس ل سەر */
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border: none;
            transition: transform 0.5s ease;
        }
        .product-img.active-img {
            display: block;
        }
        .image-slider-container:hover .product-img.active-img {
            transform: scale(1.12);
        }

        /* بها ل ڕەخێ چەپی ل بن وێنەی */
        .card-price-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 5;
            border: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* ئایکۆنا موجەب (+) ل ڕەخێ ڕاستێ ل بن وێنەی */
        .card-plus-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s;
            border: 1px solid var(--dark-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card-plus-btn:hover {
            background: var(--dark-color);
            color: #fff;
        }

        .btn {
            background: var(--dark-color); color: #fff;
            padding: 10px 20px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        .btn:hover { background: #333; }

        /* Full Screen Perfect Fit Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; overflow: hidden; }
        .modal-content { background: #FFFFFF; color: var(--primary-color); padding: 20px 30px; width: 100%; max-width: 550px; position: relative; text-align: right; display: flex; flex-direction: column; justify-content: center; height: 100%; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .close-btn { position: absolute; top: 20px; left: 25px; font-size: 28px; cursor: pointer; color: var(--dark-color); font-weight: bold; z-index: 1010; background: #f0f0f0; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .close-btn:hover { background: var(--dark-color); color: #fff; }
        
        .modal-slider-box {
            position: relative;
            width: 100%;
            height: 280px;
            background: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: none;
            touch-action: pan-y;
        }
        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border: none;
        }
        .modal-img.active-modal-img {
            display: block;
        }
        
        /* سەهمێن ناڤ مۆدالێ ژی هاتنە لادان و ل شینا وێ کشاندن هاتە دانان */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            font-size: 14px;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 10px;
        }
        .qty-btn {
            background: #f4f4f4;
            border: 1px solid #ccc;
            width: 25px;
            height: 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            color: var(--dark-color);
        }
        .qty-btn:hover { background: var(--dark-color); color: #fff; }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            text-align: left;
            color: var(--dark-color);
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; color: var(--dark-color); font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; background: #fafafa; color: var(--primary-color); }

        footer { 
            background: #FFFFFF; 
            color: var(--dark-color); 
            text-align: center; 
            padding: 35px 20px; 
            margin-top: 50px; 
            border-top: 1px solid #eaeaea; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero">
            <div class="hero-cart-icon" onclick="openCartModal()" title="سەلکا من">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hero-cart-badge" id="cartCount">0</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-filters" id="filter-buttons">
            <button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>
        </div>

        <div class="products-grid" id="product-list">
            <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن ژ Google Sheets...</p>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content" id="productModalContent">
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-content" style="height: auto; min-height: auto; border-radius: 10px; border: 2px solid var(--dark-color); max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>سەلکا خڕکردنێ</h2>
            
            <div id="cartItemsList" style="margin-top: 15px;">
                <p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>
            </div>

            <div class="cart-total" id="cartTotalPrice" style="display: none;"></div>

            <button class="btn" id="showOrderFormBtn" onclick="showForm()" style="width: 100%; display: none; margin-top: 15px;">داخاز بکە</button>

            <form id="orderForm" onsubmit="submitOrder(event)" style="display: none; margin-top: 20px;">
                <hr style="margin-bottom: 15px; border: 0; border-top: 1px solid #eee;">
                <h3>زانیاریێن وەرگرتنێ</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label>ناڤێ تە:</label>
                    <input type="text" id="customerName" required placeholder="ناڤێ تە یێ تەمام">
                </div>
                <div class="form-group">
                    <label>ژمارا مۆبایلێ:</label>
                    <input type="tel" id="customerPhone" required placeholder="0750XXXXXXX">
                </div>
                <div class="form-group">
                    <label>نیشانگەهـ (ناڤونیشان):</label>
                    <textarea id="customerAddress" rows="3" required placeholder="شار، کۆڵان، نزیک..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">ناردنا داخازێ</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 هەمی ماف پارێزراوین.</p>
    </footer>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';

        let allProducts = [];
        let availableBrands = new Set(['all']);
        let cart = [];

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('خەلەتی:', error);
                document.getElementById('product-list').innerHTML = '<p style="text-align: center; color: red; grid-column: 1/-1;">خەلەتی د ڤەکولینا داتایێن شیتی دا چێبوو.</p>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    const product = {
                        name: row[0].replace(/^"|"$/g, ''),
                        brand: row[1].toLowerCase().replace(/^"|"$/g, ''),
                        price: row[2].replace(/^"|"$/g, ''),
                        imgs: [
                            row[3].replace(/^"|"$/g, ''),
                            row[4].replace(/^"|"$/g, ''),
                            row[5].replace(/^"|"$/g, '')
                        ].filter(img => img !== ''),
                        desc: row[6].replace(/^"|"$/g, '')
                    };
                    
                    if (product.name) {
                        allProducts.push(product);
                        availableBrands.add(product.brand);
                    }
                }
            }

            buildFilterButtons();
            displayProducts(allProducts);
        }

        function buildFilterButtons() {
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>`;

            availableBrands.forEach(brand => {
                if (brand !== 'all') {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.setAttribute('onclick', `filterProducts('${brand}', this)`);
                    btn.innerText = brand.toUpperCase();
                    filterContainer.appendChild(btn);
                }
            });
        }

        const productListContainer = document.getElementById('product-list');

        function displayProducts(filteredProducts) {
            productListContainer.innerHTML = '';
            if(filteredProducts.length === 0) {
                productListContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">چ دەمژمێر د ڤی بەشی دا نینن.</p>';
                return;
            }

            filteredProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => {
                    let activeClass = imgIdx === 0 ? 'active-img' : '';
                    imagesHTML += `<img src="${imgUrl}" class="product-img ${activeClass}" alt="Watch">`;
                });

                if(product.imgs.length === 0) {
                    imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;
                }

                // زێدەکرنا تەکنۆلۆژیایا Touch Swipe بۆ کشاندنا وێنەیان ب دەستی (بێ سەهم)
                card.innerHTML = `
                    <div class="image-slider-container" id="slider-${index}" 
                         ontouchstart="window.touchStartX_${index} = event.touches[0].clientX" 
                         ontouchend="let endX = event.changedTouches[0].clientX; if(window.touchStartX_${index} - endX > 40) changeCardImage(${index}, 1); else if(endX - window.touchStartX_${index} > 40) changeCardImage(${index}, -1);"
                         onclick="openProductModal(${index})" title="کلیک بکە بۆ دیتیڤایێن دەمژمێرێ">
                        ${imagesHTML}
                        <div class="card-price-tag">${product.price}</div>
                        <div class="card-plus-btn" onclick="event.stopPropagation(); addToCart('${product.name.replace(/'/g, "\\'")}', '${product.price}')" title="زێدەکرن بۆ سەلکێ">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                    </div>
                `;
                productListContainer.appendChild(card);
            });
        }

        function changeCardImage(productIndex, direction) {
            const sliderContainer = document.getElementById(`slider-${productIndex}`);
            if(!sliderContainer) return;
            const images = sliderContainer.querySelectorAll('.product-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-img');
        }

        function openProductModal(index) {
            const product = allProducts[index];
            const modalContent = document.getElementById('productModalContent');
            
            let modalImagesHTML = '';
            product.imgs.forEach((imgUrl, imgIdx) => {
                let activeClass = imgIdx === 0 ? 'active-modal-img' : '';
                modalImagesHTML += `<img src="${imgUrl}" class="modal-img ${activeClass}" alt="Watch">`;
            });

            if(product.imgs.length === 0) {
                modalImagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="modal-img active-modal-img" alt="Watch">`;
            }

            modalContent.innerHTML = `
                <span class="close-btn" onclick="closeProductModal()">&times;</span>
                
                <!-- کشاندنا پەنجەیی ناڤ مۆدالێ ژی -->
                <div class="modal-slider-box" id="modalSlider"
                     ontouchstart="window.modalTouchStartX = event.touches[0].clientX"
                     ontouchend="let endX = event.changedTouches[0].clientX; if(window.modalTouchStartX - endX > 40) changeModalImage(1); else if(endX - window.modalTouchStartX > 40) changeModalImage(-1);">
                    ${modalImagesHTML}
                </div>

                <h2 style="color: var(--primary-color); font-size: 22px; margin-bottom: 4px;">${product.name}</h2>
                <div style="font-size: 13px; color: var(--primary-color); font-weight: bold; text-transform: uppercase; margin-bottom: 8px;">مارکە: ${product.brand}</div>
                <p style="font-size: 13px; color: var(--gray-color); margin-bottom: 8px; line-height: 1.4;"><b>تێبینی:</b> ${product.desc}</p>
                <div style="font-size: 18px; font-weight: bold; color: var(--primary-color); margin-bottom: 15px;">نرخ: ${product.price}</div>

                <button class="btn" style="width: 100%;" onclick="addFromModal('${product.name.replace(/'/g, "\\'")}', '${product.price}')">
                    <i class="fa-solid fa-cart-shopping"></i> زێدە کەر بۆ سەلکێ
                </button>
            `;

            document.getElementById('productModal').style.display = 'flex';
        }

        function changeModalImage(direction) {
            const sliderBox = document.getElementById('modalSlider');
            if(!sliderBox) return;
            const images = sliderBox.querySelectorAll('.modal-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-modal-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-modal-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-modal-img');
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addFromModal(name, price) {
            addToCart(name, price);
            closeProductModal();
        }

        function filterProducts(brand, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            if (brand === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.brand === brand);
                displayProducts(filtered);
            }
        }

        function addToCart(name, price) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartCount();
            alert(`(${name}) ب سەرکەفتی هاتە زێدەکرن بۆ سەلکا تە!`);
        }

        function updateCartCount() {
            let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        const cartModal = document.getElementById('cartModal');
        
        function openCartModal() {
            renderCartItems();
            document.getElementById('orderForm').style.display = 'none';
            cartModal.style.display = 'flex';
        }

        function renderCartItems() {
            const cartItemsList = document.getElementById('cartItemsList');
            const showOrderFormBtn = document.getElementById('showOrderFormBtn');
            const cartTotalPrice = document.getElementById('cartTotalPrice');

            cartItemsList.innerHTML = '';

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>';
                showOrderFormBtn.style.display = 'none';
                cartTotalPrice.style.display = 'none';
                document.getElementById('orderForm').style.display = 'none';
            } else {
                let total = 0;
                cart.forEach((item, idx) => {
                    let numericPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                    let itemTotal = numericPrice * item.qty;
                    total += itemTotal;

                    cartItemsList.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <b style="color: var(--primary-color);">${item.name}</b><br>
                                <span style="font-size: 12px; color: #777;">${item.price} × ${item.qty} = $${itemTotal}</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                                    <span style="color: var(--primary-color); font-weight: bold;">${item.qty}</span>
                                    <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                                </div>
                                <i class="fa-solid fa-trash" style="color: #ff6b6b; cursor:pointer; margin-right:8px;" onclick="removeFromCart(${idx})"></i>
                            </div>
                        </div>
                    `;
                });

                cartTotalPrice.style.display = 'block';
                cartTotalPrice.innerText = `کۆی گشتی: $${total}`;
                showOrderFormBtn.style.display = 'block';
            }
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartCount();
            renderCartItems();
        }

        function closeCartModal() {
            cartModal.style.display = 'none';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            renderCartItems();
        }

        function showForm() {
            document.getElementById('showOrderFormBtn').style.display = 'none';
            document.getElementById('orderForm').style.display = 'block';
        }

        window.onclick = function(event) {
            if (event.target == cartModal) { closeCartModal(); }
        }

        function submitOrder(event) {
            event.preventDefault();
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            
            alert(`سوپاس بۆ تە ${name}! داخازا تە ب سەرکەفتی هاتە وەرگرتن. ئەم د زووترین دەمدا ل سەر ژمارا (${phone}) دێ پەیوەندێ ب تە کەین.`);
            
            cart = [];
            updateCartCount();
            closeCartModal();
            document.getElementById('orderForm').reset();
        }

        fetchSheetData();
    </script>
</body>
</html>
