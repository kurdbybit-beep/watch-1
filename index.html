<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جیهانا دەمژمێران | Watch Store</title>
    <!-- FontAwesome بۆ ئایکۆنان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d4af37;
            --dark-color: #121212;
            --light-color: #292626;
            --gray-color: #aaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; }
        body { background-color: var(--light-color); color: #fff; line-height: 1.6; }

        /* Hero Section with Floating Cart Icon on Left */
        .hero-section {
            background-color: #292626;
            padding: 30px 20px 20px 20px;
            display: flex;
            justify-content: center;
        }

        .hero {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 400px;
            background: url('https://i.ibb.co/3mM5Qd1t/images-7.jpg') no-repeat center center/cover;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: none;
        }

        /* ئایکۆنا سەلکێ ل ڕەخێ چەپی ل سەر وێنەیێ سەرەکی */
        .hero-cart-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            font-size: 20px;
            border: 2px solid var(--primary-color);
        }
        .hero-cart-icon:hover {
            background: var(--primary-color);
            color: var(--dark-color);
        }
        .hero-cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
        }

        .wave-container-top {
            position: absolute;
            top: -1px;
            left: 0;
            width: 100%;
            height: 46px;
            overflow: hidden;
            line-height: 0;
            pointer-events: none;
            transform: scaleY(-1);
        }

        .wave-container-bottom {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 46px;
            overflow: hidden;
            line-height: 0;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path fill="%23292626" fill-opacity="1" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,138.7C672,128,768,160,864,186.7C960,213,1056,235,1152,218.7C1248,203,1344,149,1392,122.7L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: 50% 100%;
            animation: waveAnimation 6s linear infinite;
        }

        .wave.wave2 {
            bottom: 0;
            opacity: 0.5;
            animation: waveAnimation 3.5s linear infinite reverse;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path fill="%23292626" fill-opacity="1" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,197.3C672,192,768,160,864,149.3C960,139,1056,149,1152,176C1248,203,1344,245,1392,266.7L1440,288L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: 50% 100%;
        }

        @keyframes waveAnimation {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #1e1b1b;
            border: 2px solid var(--primary-color);
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-color);
            color: var(--dark-color);
        }

        /* بەرهەم دکەڤنە بن ئێك (ڕێزەک بۆ هەر بەرهەمەکی) */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .product-card {
            background: #1e1b1b; 
            border-radius: 10px; 
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            transition: 0.3s;
            color: #fff;
            width: 100%;
        }
        .product-card:hover { 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
        }
        
        .image-slider-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #292626;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .product-img.active-img {
            display: block;
        }

        /* بها ل ڕەخێ چەپی ل بن وێنەی */
        .card-price-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ئایکۆنا موجەب (+) ل ڕەخێ ڕاستێ ل بن وێنەی */
        .card-plus-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--primary-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s;
            border: 1px solid var(--primary-color);
        }
        .card-plus-btn:hover {
            background: var(--primary-color);
            color: var(--dark-color);
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 3px;
            transition: 0.2s;
            z-index: 5;
        }
        .slider-btn:hover { background: var(--primary-color); color: var(--dark-color); }
        .prev-btn { right: 12px; }
        .next-btn { left: 12px; }

        .btn {
            background: var(--primary-color); color: var(--dark-color);
            padding: 10px 20px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        .btn:hover { background: #b3922d; color: #fff; }

        /* Full Screen Perfect Fit Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: #292626; justify-content: center; align-items: center; overflow: hidden; }
        .modal-content { background: #292626; color: #fff; padding: 20px 30px; width: 100%; max-width: 550px; position: relative; text-align: right; display: flex; flex-direction: column; justify-content: center; height: 100%; margin: auto; }
        .close-btn { position: absolute; top: 20px; left: 25px; font-size: 28px; cursor: pointer; color: #fff; font-weight: bold; z-index: 1010; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .close-btn:hover { background: var(--primary-color); color: var(--dark-color); }
        
        /* Modal Slider Container with Big Arrows */
        .modal-slider-box {
            position: relative;
            width: 100%;
            height: 280px;
            background: #292626;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .modal-img.active-modal-img {
            display: block;
        }
        .modal-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid var(--primary-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: 0.3s;
        }
        .modal-arrow:hover {
            background: var(--primary-color);
            color: var(--dark-color);
        }
        .modal-prev { right: 15px; }
        .modal-next { left: 15px; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 12px 0;
            font-size: 14px;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 10px;
        }
        .qty-btn {
            background: #1e1b1b;
            border: 1px solid #444;
            width: 25px;
            height: 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            color: #fff;
        }
        .qty-btn:hover { background: var(--primary-color); color: var(--dark-color); }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            text-align: left;
            color: var(--primary-color);
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; color: #fff; font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 5px; background: #1e1b1b; color: #fff; }

        footer { 
            background: #292626; 
            color: #fff; 
            text-align: center; 
            padding: 35px 20px; 
            margin-top: 50px; 
            border-top: none; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Hero Section with Floating Cart Icon on Left -->
    <div class="hero-section">
        <div class="hero">
            <div class="hero-cart-icon" onclick="openCartModal()" title="سەلکا من">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="hero-cart-badge" id="cartCount">0</span>
            </div>
            <div class="wave-container-top">
                <div class="wave"></div>
                <div class="wave wave2"></div>
            </div>
            <div class="wave-container-bottom">
                <div class="wave"></div>
                <div class="wave wave2"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-filters" id="filter-buttons">
            <button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>
        </div>

        <div class="products-grid" id="product-list">
            <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن ژ Google Sheets...</p>
        </div>
    </div>

    <!-- Full Screen Perfect Fit Product Modal with Slider Arrows -->
    <div class="modal" id="productModal">
        <div class="modal-content" id="productModalContent">
            <!-- زانیاریێن دەمژمێرا دگەل سەهمێن وێنەیان لێرە دیار دبن -->
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal" style="background-color: rgba(0,0,0,0.8);">
        <div class="modal-content" style="height: auto; min-height: auto; border-radius: 10px; border: 2px solid var(--primary-color); max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <span class="close-btn" onclick="closeCartModal()" style="position: absolute; top: 15px; left: 15px; width: auto; height: auto; background: none;">&times;</span>
            <h2>سەلکا خڕکردنێ</h2>
            
            <div id="cartItemsList" style="margin-top: 15px;">
                <p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>
            </div>

            <div class="cart-total" id="cartTotalPrice" style="display: none;"></div>

            <button class="btn" id="showOrderFormBtn" onclick="showForm()" style="width: 100%; display: none; margin-top: 15px;">داخاز بکە</button>

            <form id="orderForm" onsubmit="submitOrder(event)" style="display: none; margin-top: 20px;">
                <hr style="margin-bottom: 15px; border: 0; border-top: 1px solid rgba(255,255,255,0.2);">
                <h3>زانیاریێن وەرگرتنێ</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label>ناڤێ تە:</label>
                    <input type="text" id="customerName" required placeholder="ناڤێ تە یێ تەمام">
                </div>
                <div class="form-group">
                    <label>ژمارا مۆبایلێ:</label>
                    <input type="tel" id="customerPhone" required placeholder="0750XXXXXXX">
                </div>
                <div class="form-group">
                    <label>نیشانگەهـ (ناڤونیشان):</label>
                    <textarea id="customerAddress" rows="3" required placeholder="شار، کۆڵان، نزیک..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">ناردنا داخازێ</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 هەمی ماف پارێزراوین.</p>
    </footer>

    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';

        let allProducts = [];
        let availableBrands = new Set(['all']);
        let cart = [];

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('خەلەتی:', error);
                document.getElementById('product-list').innerHTML = '<p style="text-align: center; color: red; grid-column: 1/-1;">خەلەتی د ڤەکولینا داتایێن شیتی دا چێبوو.</p>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];
            
            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    const product = {
                        name: row[0].replace(/^"|"$/g, ''),
                        brand: row[1].toLowerCase().replace(/^"|"$/g, ''),
                        price: row[2].replace(/^"|"$/g, ''),
                        imgs: [
                            row[3].replace(/^"|"$/g, ''),
                            row[4].replace(/^"|"$/g, ''),
                            row[5].replace(/^"|"$/g, '')
                        ].filter(img => img !== ''),
                        desc: row[6].replace(/^"|"$/g, '')
                    };
                    
                    if (product.name) {
                        allProducts.push(product);
                        availableBrands.add(product.brand);
                    }
                }
            }

            buildFilterButtons();
            displayProducts(allProducts);
        }

        function buildFilterButtons() {
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>`;

            availableBrands.forEach(brand => {
                if (brand !== 'all') {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.setAttribute('onclick', `filterProducts('${brand}', this)`);
                    btn.innerText = brand.toUpperCase();
                    filterContainer.appendChild(btn);
                }
            });
        }

        const productListContainer = document.getElementById('product-list');

        function displayProducts(filteredProducts) {
            productListContainer.innerHTML = '';
            if(filteredProducts.length === 0) {
                productListContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa;">چ دەمژمێر د ڤی بەشی دا نینن.</p>';
                return;
            }

            filteredProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => {
                    let activeClass = imgIdx === 0 ? 'active-img' : '';
                    imagesHTML += `<img src="${imgUrl}" class="product-img ${activeClass}" alt="Watch">`;
                });

                if(product.imgs.length === 0) {
                    imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;
                }

                let sliderBtns = '';
                if(product.imgs.length > 1) {
                    sliderBtns = `
                        <button class="slider-btn prev-btn" onclick="event.stopPropagation(); changeCardImage(${index}, -1)">&#10095;</button>
                        <button class="slider-btn next-btn" onclick="event.stopPropagation(); changeCardImage(${index}, 1)">&#10094;</button>
                    `;
                }

                card.innerHTML = `
                    <div class="image-slider-container" id="slider-${index}" onclick="openProductModal(${index})" title="کلیک بکە بۆ دیتیڤایێن دەمژمێرێ">
                        ${imagesHTML}
                        ${sliderBtns}
                        <div class="card-price-tag">${product.price}</div>
                        <div class="card-plus-btn" onclick="event.stopPropagation(); addToCart('${product.name.replace(/'/g, "\\'")}', '${product.price}')" title="زێدەکرن بۆ سەلکێ">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                    </div>
                `;
                productListContainer.appendChild(card);
            });
        }

        function changeCardImage(productIndex, direction) {
            const sliderContainer = document.getElementById(`slider-${productIndex}`);
            const images = sliderContainer.querySelectorAll('.product-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-img');
        }

        function openProductModal(index) {
            const product = allProducts[index];
            const modalContent = document.getElementById('productModalContent');
            
            let modalImagesHTML = '';
            product.imgs.forEach((imgUrl, imgIdx) => {
                let activeClass = imgIdx === 0 ? 'active-modal-img' : '';
                modalImagesHTML += `<img src="${imgUrl}" class="modal-img ${activeClass}" alt="Watch">`;
            });

            if(product.imgs.length === 0) {
                modalImagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="modal-img active-modal-img" alt="Watch">`;
            }

            let modalArrows = '';
            if(product.imgs.length > 1) {
                modalArrows = `
                    <button class="modal-arrow modal-prev" onclick="changeModalImage(-1)">&#10095;</button>
                    <button class="modal-arrow modal-next" onclick="changeModalImage(1)">&#10094;</button>
                `;
            }

            modalContent.innerHTML = `
                <span class="close-btn" onclick="closeProductModal()">&times;</span>
                
                <div class="modal-slider-box" id="modalSlider">
                    ${modalImagesHTML}
                    ${modalArrows}
                </div>

                <h2 style="color: #fff; font-size: 22px; margin-bottom: 4px;">${product.name}</h2>
                <div style="font-size: 13px; color: var(--primary-color); font-weight: bold; text-transform: uppercase; margin-bottom: 8px;">مارکە: ${product.brand}</div>
                <p style="font-size: 13px; color: var(--gray-color); margin-bottom: 8px; line-height: 1.4;"><b>تێبینی:</b> ${product.desc}</p>
                <div style="font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 15px;">نرخ: ${product.price}</div>

                <button class="btn" style="width: 100%;" onclick="addFromModal('${product.name.replace(/'/g, "\\'")}', '${product.price}')">
                    <i class="fa-solid fa-cart-shopping"></i> زێدە کەر بۆ سەلکێ
                </button>
            `;

            document.getElementById('productModal').style.display = 'flex';
        }

        function changeModalImage(direction) {
            const sliderBox = document.getElementById('modalSlider');
            if(!sliderBox) return;
            const images = sliderBox.querySelectorAll('.modal-img');
            let currentIndex = 0;

            images.forEach((img, idx) => {
                if (img.classList.contains('active-modal-img')) {
                    currentIndex = idx;
                    img.classList.remove('active-modal-img');
                }
            });

            let newIndex = currentIndex + direction;
            if (newIndex >= images.length) {
                newIndex = 0;
            } else if (newIndex < 0) {
                newIndex = images.length - 1;
            }

            images[newIndex].classList.add('active-modal-img');
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addFromModal(name, price) {
            addToCart(name, price);
            closeProductModal();
        }

        function filterProducts(brand, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            if (brand === 'all') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.brand === brand);
                displayProducts(filtered);
            }
        }

        function addToCart(name, price) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            updateCartCount();
            alert(`(${name}) ب سەرکەفتی هاتە زێدەکرن بۆ سەلکا تە!`);
        }

        function updateCartCount() {
            let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').innerText = totalCount;
        }

        const cartModal = document.getElementById('cartModal');
        
        function openCartModal() {
            renderCartItems();
            document.getElementById('orderForm').style.display = 'none';
            cartModal.style.display = 'flex';
        }

        function renderCartItems() {
            const cartItemsList = document.getElementById('cartItemsList');
            const showOrderFormBtn = document.getElementById('showOrderFormBtn');
            const cartTotalPrice = document.getElementById('cartTotalPrice');

            cartItemsList.innerHTML = '';

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>';
                showOrderFormBtn.style.display = 'none';
                cartTotalPrice.style.display = 'none';
                document.getElementById('orderForm').style.display = 'none';
            } else {
                let total = 0;
                cart.forEach((item, idx) => {
                    let numericPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                    let itemTotal = numericPrice * item.qty;
                    total += itemTotal;

                    cartItemsList.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <b style="color: #fff;">${item.name}</b><br>
                                <span style="font-size: 12px; color: #aaa;">${item.price} × ${item.qty} = $${itemTotal}</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                                    <span style="color: #fff; font-weight: bold;">${item.qty}</span>
                                    <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                                </div>
                                <i class="fa-solid fa-trash" style="color: #ff6b6b; cursor:pointer; margin-right:8px;" onclick="removeFromCart(${idx})"></i>
                            </div>
                        </div>
                    `;
                });

                cartTotalPrice.style.display = 'block';
                cartTotalPrice.innerText = `کۆی گشتی: $${total}`;
                showOrderFormBtn.style.display = 'block';
            }
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartCount();
            renderCartItems();
        }

        function closeCartModal() {
            cartModal.style.display = 'none';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            renderCartItems();
        }

        function showForm() {
            document.getElementById('showOrderFormBtn').style.display = 'none';
            document.getElementById('orderForm').style.display = 'block';
        }

        window.onclick = function(event) {
            if (event.target == cartModal) { closeCartModal(); }
        }

        function submitOrder(event) {
            event.preventDefault();
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            
            alert(`سوپاس بۆ تە ${name}! داخازا تە ب سەرکەفتی هاتە وەرگرتن. ئەم د زووترین دەمدا ل سەر ژمارا (${phone}) دێ پەیوەندێ ب تە کەین.`);
            
            cart = [];
            updateCartCount();
            closeCartModal();
            document.getElementById('orderForm').reset();
        }

        fetchSheetData();
    </script>
</body>
</html>
